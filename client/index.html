<!DOCTYPE html>
<html lang="en" class="h-full bg-[#e8e6e3]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanPro - The New Level of Care for Your Wardrobe</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Hero Gradient & Floating Animations */
    .hero-gradient {
      background: linear-gradient(135deg, #a4c4d5 0%, #ded0c7 45%, #f6ddd2 100%);
    }

    @keyframes floatShirt {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    .animate-float {
      animation: floatShirt 5s ease-in-out infinite;
    }

    .badge-border {
      border: 1.5px solid rgba(31, 41, 55, 0.7);
    }
  </style>
</head>
<body class="min-h-screen bg-[#e8e6e3] flex items-center justify-center p-4 sm:p-8 font-sans selection:bg-gray-800 selection:text-white">

  <!-- Outer Rounded Device Container -->
  <div class="w-full max-w-6xl bg-white rounded-[32px] shadow-2xl overflow-hidden flex flex-col relative border border-black/5">

    <!-- HERO MAIN SECTION (PASTEL GRADIENT) -->
    <div class="hero-gradient px-6 sm:px-12 pt-8 pb-12 relative flex-1 flex flex-col justify-between overflow-hidden">
      
      <!-- TOP NAVIGATION BAR -->
      <header class="flex items-center justify-between z-20 relative mb-8">
        
        <!-- Brand Logo -->
        <div class="flex items-center gap-2 cursor-pointer">
          <span class="font-extrabold text-xl tracking-tight text-gray-900 flex items-center gap-1.5">
            Clean<span class="font-normal text-gray-800">Pro</span>
            <svg class="w-5 h-5 text-sky-600 inline" fill="currentColor" viewBox="0 0 24 24">
              <circle cx="8" cy="14" r="3" opacity="0.8"/>
              <circle cx="15" cy="10" r="4" opacity="0.9"/>
              <circle cx="18" cy="17" r="2.5"/>
            </svg>
          </span>
        </div>

        <!-- Navigation Links -->
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-700">
          <button class="flex items-center gap-1 hover:text-gray-900 transition-colors">
            Services <span class="text-xs">▾</span>
          </button>
          <a href="#help" class="hover:text-gray-900 transition-colors">Help</a>
          <button class="flex items-center gap-1 hover:text-gray-900 transition-colors">
            Pricing <span class="text-xs">▾</span>
          </button>
          <a href="#recyclers" class="hover:text-gray-900 transition-colors">Recyclers</a>
        </nav>

        <!-- CTA Button -->
        <button type="button" onclick="showAppModal()" class="flex items-center gap-2 px-5 py-2 rounded-full border border-gray-800 text-xs font-semibold text-gray-900 hover:bg-black/5 transition-all shadow-sm active:scale-95">
          <span>Get the App</span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>
      </header>

      <!-- CENTRAL HERO GRID LAYOUT -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center z-10 relative min-h-[420px] py-4">

        <!-- LEFT SIDE: RATING & HEADLINE -->
        <div class="lg:col-span-6 space-y-4 z-20">
          
          <!-- 5 Yellow Stars -->
          <div class="flex items-center gap-1 text-yellow-400 text-lg">
            ★ ★ ★ ★ ★
          </div>

          <!-- Main Bold Headline -->
          <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-white leading-[1.08] tracking-tight drop-shadow-sm">
            The New <br class="hidden sm:inline" />
            Level of Care <br class="hidden sm:inline" />
            for Your <br class="hidden sm:inline" />
            Wardrobe
          </h1>
        </div>

        <!-- CENTER FLOATING SHIRT IMAGE WITH BADGES -->
        <div class="lg:col-span-6 relative flex items-center justify-center min-h-[360px]">
          
          <!-- Central Shirt Image -->
          <div class="relative z-10 animate-float w-72 sm:w-80 lg:w-96 flex items-center justify-center">
            <img src="assets/hero_shirt.png" alt="Clean White Shirt Floating" class="w-full h-auto object-contain drop-shadow-2xl">
          </div>

          <!-- Floating Badge 1 (Top Left) -->
          <div class="absolute top-4 left-0 sm:-left-4 z-20 bg-white/40 backdrop-blur-md px-3.5 py-1.5 rounded-full badge-border text-[11px] font-semibold text-gray-900 flex items-center gap-1.5 shadow-sm max-w-[220px] sm:max-w-none">
            <svg class="w-3.5 h-3.5 text-gray-800 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 2L9.5 8.5L3 9.5L7.8 14L6.2 20.5L12 17L17.8 20.5L16.2 14L21 9.5L14.5 8.5L12 2Z" />
            </svg>
            <span>Tough stains? We'll make your clothes flawless!</span>
            <svg class="w-3.5 h-3.5 text-gray-800 flex-shrink-0 rotate-45" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 2L9.5 8.5L3 9.5L7.8 14L6.2 20.5L12 17L17.8 20.5L16.2 14L21 9.5L14.5 8.5L12 2Z" />
            </svg>
          </div>

          <!-- Floating Badge 2 (Middle Right) -->
          <div class="absolute bottom-24 right-0 sm:-right-4 z-20 bg-white/40 backdrop-blur-md px-3.5 py-1.5 rounded-full badge-border text-[11px] font-semibold text-gray-900 flex items-center gap-1.5 shadow-sm max-w-[220px] sm:max-w-none">
            <svg class="w-3.5 h-3.5 text-gray-800 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 2L9.5 8.5L3 9.5L7.8 14L6.2 20.5L12 17L17.8 20.5L16.2 14L21 9.5L14.5 8.5L12 2Z" />
            </svg>
            <span>We'll Handle Any Stain — Guaranteed Removal</span>
            <svg class="w-3.5 h-3.5 text-gray-800 flex-shrink-0 rotate-45" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 2L9.5 8.5L3 9.5L7.8 14L6.2 20.5L12 17L17.8 20.5L16.2 14L21 9.5L14.5 8.5L12 2Z" />
            </svg>
          </div>

          <!-- RIGHT FLOATING STATS CARD -->
          <div class="absolute bottom-0 right-2 z-30 bg-[#eef0f2]/85 backdrop-blur-xl rounded-2xl p-4 w-44 sm:w-48 shadow-xl border border-white/60 text-center transform hover:scale-105 transition-transform">
            <div class="w-full h-24 mb-2 overflow-hidden rounded-xl bg-white/50 flex items-center justify-center p-1">
              <img src="assets/folded_shirts.png" alt="Folded Shirts Stack" class="w-full h-full object-contain">
            </div>
            <h3 class="text-2xl font-extrabold text-gray-900 tracking-tight">2.7k+</h3>
            <p class="text-[10px] font-semibold text-gray-600 leading-snug mt-0.5">
              Just Trust Us — <br/>We'll Take Care of It
            </p>
          </div>

        </div>

      </div>

    </div>

    <!-- BOTTOM DARK TOOLBAR -->
    <footer class="bg-[#182227] px-6 sm:px-12 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-gray-800">
      
      <!-- Customer Avatar Stack -->
      <div class="flex items-center gap-3">
        <div class="flex -space-x-2 overflow-hidden">
          <img class="inline-block h-8 w-8 rounded-full ring-2 ring-[#182227] object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Customer 1">
          <img class="inline-block h-8 w-8 rounded-full ring-2 ring-[#182227] object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80" alt="Customer 2">
          <img class="inline-block h-8 w-8 rounded-full ring-2 ring-[#182227] object-cover" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&auto=format&fit=crop&q=80" alt="Customer 3">
          <img class="inline-block h-8 w-8 rounded-full ring-2 ring-[#182227] object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" alt="Customer 4">
          <img class="inline-block h-8 w-8 rounded-full ring-2 ring-[#182227] object-cover" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=100&auto=format&fit=crop&q=80" alt="Customer 5">
        </div>
        <span class="text-white text-sm font-bold tracking-wide">5k+</span>
      </div>

      <!-- Action Button -->
      <button type="button" onclick="showReservationModal()" class="w-full sm:w-auto px-6 py-2.5 bg-white text-gray-900 font-semibold text-xs rounded-full hover:bg-gray-100 transition-transform active:scale-95 shadow-md flex items-center justify-center gap-1.5">
        <span>Reserve Service</span>
        <span class="text-sm font-bold">↗</span>
      </button>
    </footer>

  </div>

  <!-- Interactive Reservation Modal -->
  <div id="reservation-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl relative">
      <button onclick="closeReservationModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-800 text-xl font-bold">&times;</button>
      
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center mx-auto mb-2 text-xl font-bold">
          ✨
        </div>
        <h3 class="text-xl font-extrabold text-gray-900">Reserve Wardrobe Care</h3>
        <p class="text-xs text-gray-500 mt-1">Schedule complimentary pick-up & doorstep care</p>
      </div>

      <form onsubmit="event.preventDefault(); submitReservation();" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Your Full Name</label>
          <input type="text" required placeholder="Eleanor Vance" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm text-gray-900 focus:outline-none focus:border-sky-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Phone Number</label>
          <input type="tel" required placeholder="+1 (555) 123-4567" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm text-gray-900 focus:outline-none focus:border-sky-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Service Required</label>
          <select class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm text-gray-900 focus:outline-none focus:border-sky-600">
            <option>Flawless Stain Removal & Pressing</option>
            <option>Luxury Garment Dry Cleaning</option>
            <option>Concierge Wardrobe Pickup</option>
          </select>
        </div>

        <button type="submit" class="w-full py-3 bg-gray-900 text-white font-bold text-xs uppercase tracking-wider rounded-xl hover:bg-black transition-colors shadow-lg mt-2">
          Confirm Reservation
        </button>
      </form>
    </div>
  </div>

  <script>
    function showReservationModal() {
      const modal = document.getElementById('reservation-modal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeReservationModal() {
      const modal = document.getElementById('reservation-modal');
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    function showAppModal() {
      alert("CleanPro App download link sent! Check your smartphone.");
    }

    function submitReservation() {
      closeReservationModal();
      alert("Reservation Confirmed! A CleanPro specialist will contact you shortly.");
    }
  </script>
</body>
</html>
